name: Chemistry checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  chemistry:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r skills/organic-chem-review/scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
